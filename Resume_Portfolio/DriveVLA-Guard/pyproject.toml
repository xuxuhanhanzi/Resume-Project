[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drivevla-guard"
version = "1.0.2"
description = "Risk-aware inference-time candidate reranking and selective reasoning for driving VLAs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "DriveVLA-Guard contributors"}]
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.7"]
autovla = [
  "torch>=2.4",
  "transformers>=4.49",
  "qwen-vl-utils>=0.0.8",
]

[project.scripts]
drivevla-guard = "drivevla_guard.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
