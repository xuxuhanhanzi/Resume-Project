name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --requirement requirements-dev.lock
      - run: python -m pip install --editable .
      - run: python scripts/dev.py check

  security-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements-dev.lock
      - run: python -m pip install --editable .
      - run: docker build -t repopilot-sandbox:20260814 -f deploy/docker/sandbox.Dockerfile .
      - run: python -m pytest -q tests/safety/test_security_container_live.py
        env:
          REPOPILOT_RUN_DOCKER_SECURITY: "1"
          REPOPILOT_SANDBOX_IMAGE: repopilot-sandbox:20260814
