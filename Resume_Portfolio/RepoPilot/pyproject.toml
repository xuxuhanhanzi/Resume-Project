[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "repopilot"
version = "1.19.0"
description = "A compact, inspectable agent runtime and coding-agent technology lab."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE.md"}
dependencies = ["PyYAML>=6,<7", "keyring>=25,<26", "prompt_toolkit>=3.0,<4"]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=7.4,<9",
  "ruff>=0.6,<1",
  "types-PyYAML>=6,<7",
]
service = ["uvicorn>=0.30,<1"]

[project.scripts]
repopilot = "repopilot.cli:entrypoint"
repopilot-api = "repopilot.api.server:entrypoint"

[tool.setuptools.package-data]
repopilot = ["evaluation/fixtures/*.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: crosses multiple RepoPilot components",
  "safety: validates a security boundary",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
# Exclude run-once ML glue and third-party eval fixtures (checked-out gold
# repos under evaluation/benchmarks/workspaces, micro-benchmark cases under
# evaluation/cases) so `mypy .` cannot choke on invalid package names such as
# a cookiecutter template dir inside a gold repo.
exclude = ["serve_hf_model|train_qwen_qlora|train_qwen_dpo|merge_adapter_and_prep_eval|evaluation/|artifacts/|build/|external/"]

# Third-party libraries that ship no type stubs. Per remediation plan P0-1,
# only module-level overrides are allowed (never a global ignore_errors).
[[tool.mypy.overrides]]
module = ["pyarrow.*", "datasets.*", "peft.*", "transformers.*", "trl.*", "bitsandbytes.*", "pandas.*"]
ignore_missing_imports = true

# Heavy ML training glue: transformers/peft/trl ship incomplete type hints.
# These modules are run-once offline scripts; we disable only the error codes
# caused by untyped third-party calls, keeping our own code strictly typed.
[[tool.mypy.overrides]]
module = ["train_qwen_qlora", "train_qwen_dpo", "merge_adapter_and_prep_eval", "serve_hf_model"]
disable_error_code = ["attr-defined", "no-untyped-call", "assignment", "no-untyped-def"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
