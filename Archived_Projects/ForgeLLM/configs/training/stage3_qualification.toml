[model]
vocab_size = 320
d_model = 256
n_layers = 7
n_heads = 8
n_kv_heads = 2
ffn_hidden_dim = 768
max_seq_len = 128
rms_norm_eps = 0.00001
rope_theta = 10000.0
dropout = 0.0
tie_embeddings = true
qk_norm = true
attention_backend = "sdpa"

[training]
run_name = "stage3-qualification"
seed = 20260727
device = "auto"
precision = "bf16"
optimizer = "adamw"
sequence_length = 128
micro_batch_size = 4
gradient_accumulation_steps = 2
max_steps = 100
learning_rate = 0.0003
muon_learning_rate = 0.02
min_lr_ratio = 0.1
warmup_steps = 10
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
gradient_clip_norm = 1.0
validation_interval = 25
validation_batches = 4
checkpoint_interval = 50
log_interval = 1
mtp_future_tokens = 0
mtp_loss_weight = 0.0
