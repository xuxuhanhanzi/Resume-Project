[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "forgellm"
dynamic = ["version"]
description = "A reproducible learning project for LLM data, training, evaluation, and serving."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE.md"}
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=7.4,<9",
  "ruff>=0.6,<1",
]
tokenizer-reference = [
  "tokenizers==0.22.2",
]
model = [
  "numpy>=2.2,<2.3",
  "torch==2.6.0; platform_system != 'Windows'",
  "torch==2.6.0+cu124; platform_system == 'Windows'",
]
post-training = [
  "accelerate==1.14.0",
  "bitsandbytes==0.49.2",
  "datasets==5.0.0",
  "peft==0.19.1",
  "transformers==5.14.1",
  "trl==1.8.0",
]

[project.scripts]
forgellm = "forgellm.cli:entrypoint"

[tool.setuptools.dynamic]
version = {attr = "forgellm._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
